<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>La carte de la science des sols</title>
<link rel="stylesheet" href="colors_and_type.css"/>
<link rel="stylesheet" href="map-shared.css"/>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css"/>
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css"/>
<script src="panzoom.min.js" defer></script>
<style>
/* ═══════════════════════════════════════════════════════════════════════
   THE FIELD ATLAS — pannable / zoomable edition
   A typographic plate of soil science you navigate like a real map.
   ═══════════════════════════════════════════════════════════════════════ */

:root {
  --plate-w: 3520px;
  --plate-h: 2000px;
  --frame: 56px;
  --topbar-h: 56px;
}

* { box-sizing: border-box; }

html, body {
  background:
    radial-gradient(1600px 900px at 50% 0%, rgba(90,58,34,.04), transparent),
    #EEE9DF;
  color: var(--soil);
  font-family: var(--font-sans);
  height: 100%;
  overflow: hidden;
}
body { margin: 0; }

/* ─── Top bar ─── */
.topbar {
  position: fixed; top: 0; left: 0; right: 0; height: var(--topbar-h);
  display: flex; align-items: center;
  gap: 18px;
  padding: 0 18px;
  background: rgba(247, 245, 240, 0.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--soil-10);
  z-index: 50;
}
.topbar .mark {
  color: var(--soil);
  display: inline-flex; align-items: center;
  flex: none;
}
.topbar .mark svg { display: block; }
.topbar .brandline {
  font-family: var(--font-mono); font-size: 10px;
  letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--soil-60);
  display: flex; gap: 8px; align-items: center;
  flex: none;
}
.topbar .brandline .dot {
  width: 3px; height: 3px; border-radius: 9999px; background: var(--soil-30);
}
.topbar .brandline .tag { color: var(--soil-60); }
.topbar .title {
  flex: 1; min-width: 0;
  display: flex; align-items: baseline; gap: 14px;
  overflow: hidden;
}
.topbar .title h1 {
  margin: 0;
  font-size: 17px;
  font-weight: 700;
  letter-spacing: -0.015em;
  color: var(--soil);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.topbar .title .stat-inline {
  font-family: var(--font-mono); font-size: 10px;
  letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--soil-60);
  white-space: nowrap;
  flex: none;
}
.topbar .title .stat-inline b { color: var(--soil); font-weight: 700; }
.topbar .actions {
  display: inline-flex; align-items: center; gap: 8px;
  flex: none;
}
.topbar .lang-grp {
  display: inline-flex; align-items: center;
  background: var(--white);
  border: 1px solid var(--soil-15);
  border-radius: 9999px;
  padding: 3px;
}
.topbar .lang-grp button {
  padding: 4px 11px; border-radius: 9999px;
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--soil); border: 0; background: none;
  cursor: pointer;
  transition: background var(--duration-fast) var(--ease-out),
              color var(--duration-fast) var(--ease-out);
}
.topbar .lang-grp button:hover { background: var(--soil-05); }
.topbar .lang-grp button.active { background: var(--soil); color: var(--root); }

.topbar .iconbtn {
  display: inline-flex; align-items: center; justify-content: center;
  gap: 6px;
  height: 30px; padding: 0 12px;
  background: var(--white);
  border: 1px solid var(--soil-15);
  border-radius: 9999px;
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--soil);
  cursor: pointer;
  transition: background var(--duration-fast) var(--ease-out),
              border-color var(--duration-fast) var(--ease-out),
              color var(--duration-fast) var(--ease-out);
}
.topbar .iconbtn:hover { background: var(--soil); color: var(--root); border-color: var(--soil); }
.topbar .iconbtn.icon-only { width: 30px; padding: 0; }
.topbar .iconbtn i { font-size: 14px; }

/* ─── Viewport (the map area) ─── */
.viewport {
  position: fixed;
  top: var(--topbar-h);
  left: 0; right: 0; bottom: 0;
  overflow: hidden;
  background: #EEE9DF;
  cursor: grab;
}
.viewport.dragging { cursor: grabbing; }

.plate-inner {
  position: relative;
  width: var(--plate-w);
  height: var(--plate-h);
  background: var(--root);
  border: 1px solid var(--soil-15);
  border-radius: 6px;
  box-shadow: 0 10px 60px rgba(59,50,44,.10);
  /* the inner frame is on .plate-frame so it doesn't interfere with .zone children */
  transform-origin: 0 0;
}
.plate-inner .plate-frame {
  position: absolute; inset: var(--frame);
  border: 1px solid var(--soil-10);
  border-radius: 3px;
  pointer-events: none;
  z-index: 1;
}
.plate-inner .plate-ticks {
  position: absolute;
  inset: calc(var(--frame) - 14px);
  pointer-events: none; z-index: 2;
  background-image:
    linear-gradient(to right,  var(--soil) 18px, transparent 18px),
    linear-gradient(to right,  var(--soil) 18px, transparent 18px),
    linear-gradient(to bottom, var(--soil) 18px, transparent 18px),
    linear-gradient(to bottom, var(--soil) 18px, transparent 18px);
  background-repeat: no-repeat;
  background-position: top left, top right, top left, top right;
  background-size: 18px 1.5px, 18px 1.5px, 1.5px 18px, 1.5px 18px;
}
.plate-inner .plate-ticks::after {
  content: "";
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(to right,  var(--soil) 18px, transparent 18px),
    linear-gradient(to right,  var(--soil) 18px, transparent 18px),
    linear-gradient(to bottom, var(--soil) 18px, transparent 18px),
    linear-gradient(to bottom, var(--soil) 18px, transparent 18px);
  background-repeat: no-repeat;
  background-position: bottom left, bottom right, bottom left, bottom right;
  background-size: 18px 1.5px, 18px 1.5px, 1.5px 18px, 1.5px 18px;
}

/* The "stage" — children of plate-inner positioned by % within the frame */
.plate-stage {
  position: absolute;
  inset: var(--frame);
  z-index: 3;
}

/* Plate masthead (in-canvas printed title) */
.plate-masthead {
  position: absolute;
  top: -32px; left: 0; right: 0;
  text-align: center;
  font-family: var(--font-mono); font-size: 14px;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--soil-60);
  pointer-events: none;
}
.plate-masthead b { color: var(--soil); font-weight: 700; letter-spacing: 0.22em; }

/* ─── Axis labels (viewport-fixed, always visible) ─── */
.axes {
  position: fixed;
  top: var(--topbar-h);
  left: 0; right: 0; bottom: 0;
  pointer-events: none;
  z-index: 30;
}
.axis {
  position: absolute;
  font-family: var(--font-mono); font-size: 10.5px;
  letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--soil-60);
  background: rgba(247, 245, 240, 0.78);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  padding: 5px 12px;
  border: 1px solid var(--soil-10);
  border-radius: 9999px;
  white-space: nowrap;
}
.axis b { color: var(--soil); font-weight: 700; letter-spacing: 0.20em; }
.axis.top    { top: 12px;    left: 50%; transform: translateX(-50%); }
.axis.bottom { bottom: 12px; left: 50%; transform: translateX(-50%); }
.axis.left   { left: 14px;   top: 50%;  transform: translate(-50%, -50%) rotate(-90deg); transform-origin: center; }
.axis.right  { right: 14px;  top: 50%;  transform: translate(50%, -50%)  rotate(90deg);  transform-origin: center; }

/* ─── Zones ─── */
.zone {
  position: absolute;
  background:
    linear-gradient(180deg, var(--zt), rgba(247,245,240,.04));
  padding: 22px 26px 26px;
  overflow: hidden;
  z-index: 3;
  border-top: 3px solid var(--zc);
  border-radius: 4px;
}

.zone .zone-figure {
  margin: 0;
  padding: 6px;
  border: 1px solid color-mix(in oklab, var(--soil) 12%, transparent);
  border-radius: 4px;
  background: color-mix(in oklab, var(--root) 65%, transparent);
  display: flex; align-items: center; justify-content: center;
  min-width: 0; min-height: 0;
  overflow: hidden;
}
.zone .zone-illustration {
  display: block;
  max-width: 100%;
  max-height: 100%;
  width: auto; height: auto;
  object-fit: contain;
}
.zone .medallion {
  display: inline-flex; align-items: center; justify-content: center;
  min-width: 44px; height: 38px; padding: 0 14px;
  border: 1.5px solid var(--zc);
  border-radius: 9999px;
  font-family: var(--font-mono); font-size: 16px; font-weight: 700;
  letter-spacing: 0.06em;
  color: var(--zc);
  background: var(--root);
  flex: none;
}
.zone .zone-title {
  margin: 0;
  font-family: var(--font-sans);
  font-weight: 700;
  font-size: 32px;
  color: var(--soil);
  letter-spacing: -0.015em;
  line-height: 1.1;
  text-wrap: balance;
}
.zone .zone-title .en { display: block; }
body.lang-fr .zone .zone-title .en,
body.lang-fr .node .en { display: none; }
body.lang-en .zone .zone-title .fr,
body.lang-en .node .fr { display: none; }

/* Composition A — Folio (illustration as left-column anchor) */
.zone[data-comp="folio"] {
  display: grid;
  grid-template-columns: minmax(160px, 28%) 1fr;
  grid-template-rows: auto 1fr;
  column-gap: 24px;
  row-gap: 14px;
}
.zone[data-comp="folio"] .zone-figure {
  grid-column: 1; grid-row: 1 / -1;
  align-self: stretch;
}
.zone[data-comp="folio"] .zone-head {
  grid-column: 2; grid-row: 1;
  display: flex; gap: 14px;
  align-items: flex-start;
  min-width: 0;
}
.zone[data-comp="folio"] .nodes {
  grid-column: 2; grid-row: 2;
  align-self: start;
}

/* Composition B — Plate (illustration top-mounted as a centered specimen) */
.zone[data-comp="plate"] {
  display: grid;
  grid-template-rows: minmax(180px, 1fr) auto auto;
  row-gap: 12px;
  padding: 22px 24px;
}
.zone[data-comp="plate"] .zone-figure {
  grid-row: 1;
  align-self: stretch; justify-self: center;
  width: auto;
  aspect-ratio: 1;
  max-width: 100%;
  background: transparent;
}
.zone[data-comp="plate"] .zone-head {
  grid-row: 2;
  display: block;
  text-align: center;
}
.zone[data-comp="plate"] .zone-head .medallion {
  position: absolute;
  top: 14px; right: 14px;
  background: var(--root);
}
.zone[data-comp="plate"] .zone-title {
  font-size: 26px;
  letter-spacing: -0.005em;
  line-height: 1.16;
}
.zone[data-comp="plate"] .nodes {
  grid-row: 3;
  justify-content: center;
  gap: 7px 9px;
}
.zone[data-comp="plate"] .node {
  padding: 6px 16px 7px;
  font-size: 17px;
}

/* ─── Nodes — pill chips ─── */
.nodes {
  display: flex; flex-wrap: wrap;
  gap: 9px 11px;
  align-content: flex-start;
  flex: 1;
  min-width: 0;
}
.node {
  position: relative;
  background: var(--white);
  border: 1.25px solid var(--zc);
  border-radius: 9999px;
  padding: 7px 18px 8px;
  font-family: var(--font-sans); font-size: 18px;
  line-height: 1.25;
  color: var(--soil);
  text-align: left; cursor: pointer;
  max-width: 100%;
  min-width: 0;
  text-wrap: pretty;
  transition:
    background var(--duration-fast) var(--ease-out),
    color var(--duration-fast) var(--ease-out),
    border-color var(--duration-fast) var(--ease-out),
    transform var(--duration-fast) var(--ease-out),
    opacity var(--duration-base) var(--ease-out),
    box-shadow var(--duration-fast) var(--ease-out);
}
.node .fr, .node .en {
  display: inline;
  white-space: normal;
  font-weight: 500;
  letter-spacing: -0.003em;
}
.node:hover {
  background: var(--zc); border-color: var(--zc); color: var(--root);
  transform: translateY(-1px);
  box-shadow: 0 2px 10px rgba(59,50,44,.18);
}
.node.dim { opacity: 0.28; }
.node.highlight {
  background: var(--zc); border-color: var(--zc); color: var(--root);
  box-shadow: 0 0 0 4px var(--zt), 0 3px 14px rgba(59,50,44,.20);
}

/* ─── Zoom-aware visibility ─── */
/* Far zoom — hide pills, emphasize zones */
body.zoom-far .nodes { opacity: 0; pointer-events: none; transition: opacity .25s ease; }
body.zoom-far .zone .zone-title { font-size: 56px; }
body.zoom-far .zone[data-comp="plate"] .zone-title { font-size: 44px; }
body.zoom-far .zone .medallion { font-size: 22px; min-width: 60px; height: 50px; padding: 0 18px; }

body.zoom-mid .nodes { opacity: 1; transition: opacity .25s ease; }

/* Near zoom — slightly dim illustrations so pills stand out */
body.zoom-near .zone .zone-figure { opacity: .85; }

/* ─── Legend chip (bottom-left, expands on click) ─── */
.legend-chip {
  position: fixed;
  left: 18px; bottom: 18px;
  z-index: 40;
  background: rgba(247, 245, 240, 0.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--soil-15);
  border-radius: 14px;
  box-shadow: 0 6px 22px rgba(59,50,44,.10);
  overflow: hidden;
  max-width: 320px;
  transition: max-height .3s ease, max-width .3s ease;
}
.legend-chip .legend-toggle {
  display: flex; align-items: center; gap: 10px;
  padding: 10px 14px;
  width: 100%;
  border: 0; background: none; cursor: pointer;
  font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--soil);
}
.legend-chip .legend-toggle b { font-weight: 700; }
.legend-chip .legend-toggle .chev {
  margin-left: auto;
  transition: transform .25s ease;
  font-size: 13px; color: var(--soil-60);
}
.legend-chip.open .legend-toggle .chev { transform: rotate(180deg); }

.legend-chip .legend-body {
  display: none;
  padding: 4px 10px 12px;
  border-top: 1px solid var(--soil-10);
}
.legend-chip.open .legend-body { display: block; }
.legend-chip .lg {
  display: flex; gap: 10px; align-items: center;
  padding: 6px 8px;
  border-radius: 8px;
  cursor: pointer;
  transition: background var(--duration-fast) var(--ease-out);
  background: none; border: 0;
  width: 100%;
  text-align: left;
  font-family: inherit;
}
.legend-chip .lg:hover { background: var(--soil-05); }
.legend-chip .lg .num {
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.08em;
  color: var(--soil-60); min-width: 20px; flex: none;
}
.legend-chip .lg .sw {
  width: 14px; height: 14px; background: var(--zc);
  border-radius: 4px;
  flex: none;
}
.legend-chip .lg .lb { font-size: 13px; color: var(--soil); line-height: 1.35; }

/* ─── Minimap (bottom-right) ─── */
.minimap {
  position: fixed;
  right: 18px; bottom: 18px;
  z-index: 40;
  width: 240px;
  background: rgba(247, 245, 240, 0.92);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid var(--soil-15);
  border-radius: 14px;
  box-shadow: 0 6px 22px rgba(59,50,44,.10);
  padding: 8px;
}
.minimap .mm-title {
  display: flex; align-items: center; gap: 8px;
  padding: 2px 6px 8px;
  font-family: var(--font-mono); font-size: 10px; letter-spacing: 0.14em;
  text-transform: uppercase; color: var(--soil-60);
}
.minimap .mm-title b { color: var(--soil); font-weight: 700; }
.minimap svg.mm-svg {
  display: block;
  width: 100%;
  height: auto;
  background: var(--root);
  border-radius: 6px;
  border: 1px solid var(--soil-10);
  cursor: pointer;
}
.minimap svg.mm-svg .mm-zone { transition: opacity .15s ease; }
.minimap svg.mm-svg .mm-zone:hover { opacity: .75; }
.minimap svg.mm-svg .mm-viewport {
  fill: rgba(59,50,44,0.08);
  stroke: var(--soil);
  stroke-width: 1.5;
  pointer-events: none;
}

/* ─── Info modal ─── */
.modal-scrim {
  position: fixed; inset: 0;
  background: rgba(59, 50, 44, 0.30);
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--duration-base) var(--ease-out);
  z-index: 110;
}
body.info-open .modal-scrim { opacity: 1; pointer-events: auto; }

.info-modal {
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -48%) scale(.96);
  opacity: 0;
  pointer-events: none;
  width: min(640px, 92vw);
  max-height: min(80vh, 720px);
  overflow: auto;
  background: var(--white);
  border: 1px solid var(--soil-15);
  border-radius: 14px;
  box-shadow: 0 24px 60px rgba(59,50,44,.22);
  z-index: 120;
  transition: opacity var(--duration-base) var(--ease-out),
              transform var(--duration-base) var(--ease-out);
  padding: 32px 36px 36px;
}
body.info-open .info-modal {
  opacity: 1; pointer-events: auto;
  transform: translate(-50%, -50%) scale(1);
}
.info-modal .imclose {
  position: absolute; top: 14px; right: 14px;
  width: 32px; height: 32px; border-radius: 9999px;
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--soil-60); cursor: pointer;
  background: none; border: 0;
}
.info-modal .imclose:hover { background: var(--soil-05); color: var(--soil); }
.info-modal h2 {
  margin: 0 0 6px;
  font-family: var(--font-sans);
  font-size: clamp(24px, 2.4vw, 30px);
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--soil);
  text-wrap: balance;
}
.info-modal .im-sub {
  display: block;
  margin: 0 0 18px;
  font-size: 14.5px; color: var(--soil-60);
  line-height: 1.55;
  text-wrap: pretty;
}
.info-modal .im-stats {
  display: flex; gap: 26px;
  padding: 14px 0;
  border-top: 1px solid var(--soil-10);
  border-bottom: 1px solid var(--soil-10);
  margin-bottom: 18px;
}
.info-modal .im-stats .n { display: flex; align-items: baseline; gap: 8px; }
.info-modal .im-stats .num {
  font-family: var(--font-sans); font-size: 26px; font-weight: 700;
  letter-spacing: -0.02em; color: var(--soil); line-height: 1;
}
.info-modal .im-stats .lbl {
  font-family: var(--font-mono); font-size: 9.5px;
  letter-spacing: 0.14em; text-transform: uppercase; color: var(--soil-60);
}
.info-modal .im-section {
  margin: 18px 0 8px;
  font-family: var(--font-mono); font-size: 9.5px;
  letter-spacing: 0.14em; text-transform: uppercase; color: var(--soil-60);
  display: flex; gap: 10px; align-items: baseline;
}
.info-modal .im-section::after {
  content: ""; flex: 1; height: 1px; background: var(--soil-10);
}
.info-modal .im-blurb,
.info-modal .im-note {
  font-size: 14.5px; color: var(--soil); line-height: 1.6;
  margin: 0 0 10px;
  text-wrap: pretty;
}
.info-modal .im-blurb em,
.info-modal .im-note em { font-style: italic; color: var(--soil); }
.info-modal .im-sources {
  font-size: 12px; color: var(--soil-60); line-height: 1.55;
  margin: 0; text-wrap: pretty;
}
.info-modal .im-sources em { font-style: italic; color: var(--soil); }
.info-modal .im-credit {
  margin-top: 18px;
  font-family: var(--font-mono); font-size: 10px;
  letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--soil-60);
  display: flex; justify-content: space-between; gap: 10px;
}

/* ─── Side panel (node detail) ─── */
.panel-scrim {
  position: fixed; inset: 0;
  background: rgba(59, 50, 44, 0.22);
  opacity: 0;
  pointer-events: none;
  transition: opacity var(--duration-base) var(--ease-out);
  z-index: 90;
}
body.panel-open .panel-scrim { opacity: 1; pointer-events: auto; }

.panel {
  position: fixed; top: 0; right: 0; height: 100%;
  width: min(520px, 94vw);
  background: var(--white);
  border-left: 1px solid var(--soil-15);
  box-shadow: -18px 0 40px rgba(59,50,44,.14);
  transform: translateX(100%);
  transition: transform var(--duration-slow) var(--ease-out);
  z-index: 100; overflow: auto;
  display: flex; flex-direction: column;
}
.panel.open { transform: translateX(0); }
.panel .ptop {
  position: sticky; top: 0;
  background: var(--white);
  padding: 20px 56px 16px 28px;
  border-bottom: 1px solid var(--soil-10);
  z-index: 2;
}
.panel .close {
  position: absolute; top: 14px; right: 16px;
  width: 32px; height: 32px; border-radius: 9999px;
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--soil-60); cursor: pointer;
  background: none; border: 0;
}
.panel .close:hover { background: var(--soil-05); color: var(--soil); }
.panel .zone-chip {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 4px 12px 4px 6px;
  border: 1px solid var(--zc);

function currentLang() {
  return document.body.classList.contains('lang-en') ? 'en' : 'fr';
}

function applyI18N() {
  const lang = currentLang();
  const t = I18N[lang];
  document.documentElement.lang = lang;
  document.title = t.title;
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    if (t[key] !== undefined) el.textContent = t[key];
  });
  document.querySelectorAll('[data-i18n-html]').forEach(el => {
    const key = el.getAttribute('data-i18n-html');
    if (t[key] !== undefined) el.innerHTML = t[key];
  });
}

/* ═════ Render the plate ═════ */
ZONES.forEach((z, i) => z.num = String(i+1).padStart(2, '0'));

const stage = document.getElementById('plate-stage');

function renderZonesAndNodes() {
  ZONES.forEach(z => {
    const el = document.createElement('section');
    el.className = 'zone zone-color-' + z.id;
    el.dataset.id = z.id;
    el.dataset.comp = z.comp || 'folio';
    const [x, y, w, h] = z.bbox;
    el.style.left   = (x * 100) + '%';
    el.style.top    = (y * 100) + '%';
    el.style.width  = (w * 100) + '%';
    el.style.height = (h * 100) + '%';
    el.innerHTML = `
      ${z.img ? `<figure class="zone-figure"><img src="assets/${z.img}" class="zone-illustration" alt="" /></figure>` : ''}
      <header class="zone-head">
        <span class="medallion">${z.num}</span>
        <h2 class="zone-title">
          <span class="fr">${z.fr}</span><span class="en">${z.en}</span>
        </h2>
      </header>
      <div class="nodes" data-zone="${z.id}"></div>
    `;
    stage.appendChild(el);
  });

  NODES.forEach(n => {
    const host = stage.querySelector(`.nodes[data-zone="${n.zone}"]`);
    if (!host) return;
    const el = document.createElement('button');
    el.className = 'node';
    el.dataset.id = n.id;
    el.innerHTML = `<span class="fr">${n.fr}</span><span class="en">${n.en}</span>`;
    el.addEventListener('click', () => openNode(n.id));
    host.appendChild(el);
  });
}

/* ═════ Legend chip ═════ */
function renderLegend() {
  const lang = currentLang();
  const body = document.getElementById('legend-body');
  body.innerHTML = '';
  ZONES.forEach(z => {
    const el = document.createElement('button');
    el.className = 'lg zone-color-' + z.id;
    el.type = 'button';
    const name = (lang === 'en' ? z.en : z.fr).replace(/&amp;/g, '&').replace(/<[^>]+>/g, '');
    el.innerHTML = `
      <span class="num">${z.num}</span>
      <span class="sw"></span>
      <span class="lb">${name}</span>`;
    el.addEventListener('click', () => { flyToZone(z.id); });
    body.appendChild(el);
  });
}

function toggleLegend() {
  document.getElementById('legend-chip').classList.toggle('open');
}

/* ═════ Minimap ═════ */
const MM_W = 240, MM_H = 137;

function renderMinimap() {
  const svg = document.getElementById('mm-svg');
  // Clear and redraw zones + viewport rect
  svg.innerHTML = '';
  // background plate
  const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  bg.setAttribute('x', 0); bg.setAttribute('y', 0);
  bg.setAttribute('width', MM_W); bg.setAttribute('height', MM_H);
  bg.setAttribute('fill', '#F7F5F0');
  svg.appendChild(bg);
  // zones
  ZONES.forEach(z => {
    const [x, y, w, h] = z.bbox;
    const r = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    r.setAttribute('class', 'mm-zone');
    r.setAttribute('x', (x * MM_W).toFixed(2));
    r.setAttribute('y', (y * MM_H).toFixed(2));
    r.setAttribute('width',  (w * MM_W).toFixed(2));
    r.setAttribute('height', (h * MM_H).toFixed(2));
    const cssVar = getComputedStyle(document.documentElement).getPropertyValue('--' + z.id).trim() || '#888';
    r.setAttribute('fill', cssVar);
    r.setAttribute('opacity', '0.55');
    r.style.cursor = 'pointer';
    r.addEventListener('click', e => { e.stopPropagation(); flyToZone(z.id); });
    svg.appendChild(r);
  });
  // viewport rect (updated by updateMinimapViewport)
  const vp = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  vp.setAttribute('class', 'mm-viewport');
  vp.setAttribute('id', 'mm-vp');
  svg.appendChild(vp);
}

function updateMinimapViewport() {
  if (!panzoomInst) return;
  const t = panzoomInst.getTransform();
  const vp = document.getElementById('viewport');
  const vw = vp.clientWidth, vh = vp.clientHeight;
  // Visible canvas region (in canvas px), clamped to canvas bounds
  const canvasW = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--plate-w'));
  const canvasH = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--plate-h'));
  let visX = -t.x / t.scale, visY = -t.y / t.scale;
  let visW = vw / t.scale,   visH = vh / t.scale;
  // To minimap units
  const mx = Math.max(0, Math.min(MM_W, (visX / canvasW) * MM_W));
  const my = Math.max(0, Math.min(MM_H, (visY / canvasH) * MM_H));
  const mw = Math.max(2, Math.min(MM_W - mx, (visW / canvasW) * MM_W));
  const mh = Math.max(2, Math.min(MM_H - my, (visH / canvasH) * MM_H));
  const r = document.getElementById('mm-vp');
  if (!r) return;
  r.setAttribute('x', mx.toFixed(2));
  r.setAttribute('y', my.toFixed(2));
  r.setAttribute('width',  mw.toFixed(2));
  r.setAttribute('height', mh.toFixed(2));
}

/* Click anywhere on minimap (background) — pan to that point */
function setupMinimapClick() {
  const svg = document.getElementById('mm-svg');
  svg.addEventListener('click', e => {
    if (e.target.classList.contains('mm-zone')) return; // handled per-zone
    const rect = svg.getBoundingClientRect();
    const fx = (e.clientX - rect.left) / rect.width;   // 0..1 within minimap
    const fy = (e.clientY - rect.top)  / rect.height;
    flyToCanvasPoint(fx, fy);
  });
}

/* ═════ Pan/Zoom engine ═════ */
let panzoomInst = null;

function initPanzoom() {
  const target = document.getElementById('plate-inner');
  panzoomInst = panzoom(target, {
    bounds: true,
    boundsPadding: 0.20,
    minZoom: 0.18,
    maxZoom: 2.4,
    smoothScroll: false,
    zoomDoubleClickSpeed: 1.7,
    beforeMouseDown: e => {
      // don't start panning if the mousedown is on a node pill (let it click through)
      return e.target.closest('.node, .panel, .info-modal, .legend-chip, .minimap, .topbar') !== null;
    },
    beforeWheel: e => {
      // allow wheel zoom always
      return false;
    },
  });

  panzoomInst.on('panstart', () => document.getElementById('viewport').classList.add('dragging'));
  panzoomInst.on('panend',   () => document.getElementById('viewport').classList.remove('dragging'));

  let zoomFrame = 0;
  panzoomInst.on('transform', () => {
    if (zoomFrame) return;
    zoomFrame = requestAnimationFrame(() => {
      zoomFrame = 0;
      updateZoomClass();
      updateMinimapViewport();
    });
  });
}

function updateZoomClass() {
  if (!panzoomInst) return;
  const s = panzoomInst.getTransform().scale;
  const b = document.body;
  b.classList.toggle('zoom-far',  s < 0.40);
  b.classList.toggle('zoom-mid',  s >= 0.40 && s <= 0.95);
  b.classList.toggle('zoom-near', s > 0.95);
}

function getViewport() {
  const v = document.getElementById('viewport');
  return { w: v.clientWidth, h: v.clientHeight };
}
function getCanvasSize() {
  const root = getComputedStyle(document.documentElement);
  return {
    w: parseFloat(root.getPropertyValue('--plate-w')),
    h: parseFloat(root.getPropertyValue('--plate-h')),
  };
}

/* Compute target transform to center a canvas region in the viewport at given scale */
function computeCenterTransform(cx, cy, scale) {
  const v = getViewport();
  return {
    scale,
    x: v.w / 2 - cx * scale,
    y: v.h / 2 - cy * scale,
  };
}

/* Compute fit-to-view transform */
function computeFitTransform(pad = 0.95) {
  const v = getViewport(), c = getCanvasSize();
  const scale = Math.min(v.w / c.w, v.h / c.h) * pad;
  return computeCenterTransform(c.w / 2, c.h / 2, scale);
}

/* Compute zoom-to-zone transform */
function computeZoneTransform(zone, pad = 0.86) {
  const v = getViewport(), c = getCanvasSize();
  const [x, y, w, h] = zone.bbox;
  const zx = x * c.w, zy = y * c.h, zw = w * c.w, zh = h * c.h;
  const scale = Math.min(v.w * pad / zw, v.h * pad / zh);
  return computeCenterTransform(zx + zw / 2, zy + zh / 2, scale);
}

/* Animate panzoom to a target transform */
function smoothMoveTo(target, duration = 600) {
  if (!panzoomInst) return;
  const start = { ...panzoomInst.getTransform() };
  const t0 = performance.now();
  function tick(now) {
    const p = Math.min(1, (now - t0) / duration);
    const e = 1 - Math.pow(1 - p, 3); // easeOutCubic
    const s = start.scale + (target.scale - start.scale) * e;
    const x = start.x + (target.x - start.x) * e;
    const y = start.y + (target.y - start.y) * e;
    panzoomInst.zoomAbs(0, 0, s);
    panzoomInst.moveTo(x, y);
    if (p < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}

function fitToView(animated = false) {
  const v = getViewport();
  if (v.w < 10 || v.h < 10) return;   // viewport not ready yet
  const target = computeFitTransform();
  if (!isFinite(target.scale) || target.scale <= 0) return;
  if (animated) smoothMoveTo(target, 500);
  else {
    panzoomInst.zoomAbs(0, 0, target.scale);
    panzoomInst.moveTo(target.x, target.y);
  }
}

function flyToZone(zoneId) {
  const z = ZONES.find(x => x.id === zoneId);
  if (!z) return;
  smoothMoveTo(computeZoneTransform(z), 600);
}

function flyToCanvasPoint(fx, fy) {
  const c = getCanvasSize();
  const cur = panzoomInst.getTransform();
  const target = computeCenterTransform(fx * c.w, fy * c.h, cur.scale);
  smoothMoveTo(target, 400);
}

/* ═════ Controls ═════ */
let activeNodeId = null;

function setLang(l) {
  document.body.classList.remove('lang-fr', 'lang-en');
  document.body.classList.add('lang-' + l);
  ['fr', 'en'].forEach(k => {
    document.getElementById('btn-' + k).classList.toggle('active', k === l);
  });
  applyI18N();
  renderLegend();
  if (activeNodeId) openNode(activeNodeId);
}

/* ═════ Info modal ═════ */
function openInfo() {
  document.body.classList.add('info-open');
  document.getElementById('info-modal').setAttribute('aria-hidden', 'false');
}
function closeInfo() {
  document.body.classList.remove('info-open');
  document.getElementById('info-modal').setAttribute('aria-hidden', 'true');
}

/* ═════ Node detail panel ═════ */
function stripTags(s) { return (s || '').replace(/<[^>]+>/g, ''); }

function openNode(id) {
  const n = NODES.find(x => x.id === id); if (!n) return;
  activeNodeId = id;
  const lang = currentLang();
  const t = I18N[lang];
  const z = ZONES.find(x => x.id === n.zone);

  const chip = document.getElementById('panel-zone-chip');
  chip.className = 'zone-chip zone-color-' + z.id;
  document.getElementById('panel-zone-num').textContent = z.num;
  document.getElementById('panel-zone').textContent =
    stripTags((lang === 'en' ? z.en : z.fr).replace(/&amp;/g, '&'));
  document.getElementById('panel-title').innerHTML = lang === 'en' ? n.en : n.fr;
  document.getElementById('panel-def').innerHTML   = lang === 'en' ? n.defEn : n.defFr;

  const ul = document.getElementById('panel-subs'); ul.innerHTML = '';
  (n.subs || []).forEach(pair => {
    const li = document.createElement('li');
    const text = (lang === 'en' ? pair[1] : pair[0]).replace(/&amp;/g, '&');
    li.innerHTML = `<span>${text}</span>`;
    ul.appendChild(li);
  });

  const nb = document.getElementById('panel-neighbors'); nb.innerHTML = '';
  (n.neighbors || []).forEach(m => {
    const nn = NODES.find(x => x.id === m) || (typeof PLACEHOLDERS !== 'undefined' ? PLACEHOLDERS[m] : null);
    if (!nn) return;
    const zz = nn.zone ? ZONES.find(x => x.id === nn.zone) : null;
    const a = document.createElement('a');
    const zc = zz ? `var(--${zz.id})` : 'var(--soil-30)';
    a.style.setProperty('--ncol', zc);
    a.textContent = stripTags((lang === 'en' ? nn.en : nn.fr).replace(/&amp;/g, '&'));
    if (NODES.find(x => x.id === m)) {
      a.addEventListener('click', e => { e.preventDefault(); openNode(m); });
    } else {
      a.classList.add('ph-only');
      a.setAttribute('data-todo', t.todoBadge);
    }
    nb.appendChild(a);
  });

  document.querySelectorAll('.node').forEach(el => {
    el.classList.toggle('highlight', el.dataset.id === id);
    el.classList.toggle('dim',
      el.dataset.id !== id && !(n.neighbors || []).includes(el.dataset.id));
  });
  document.body.classList.add('panel-open');
  document.getElementById('panel').classList.add('open');
  document.getElementById('panel').setAttribute('aria-hidden', 'false');

  /* Pan so the node stays visible alongside the panel */
  setTimeout(() => {
    const nodeEl = document.querySelector('.node[data-id="' + id + '"]');
    if (!nodeEl || !panzoomInst) return;
    const v = getViewport();
    const panel = document.getElementById('panel');
    const panelW = panel.getBoundingClientRect().width;
    const visibleCenterX = (v.w - panelW) / 2;
    const visibleCenterY = v.h / 2;
    const r = nodeEl.getBoundingClientRect();
    // node center in viewport coords (relative to viewport top-left)
    const vpRect = document.getElementById('viewport').getBoundingClientRect();
    const nodeCx = r.left - vpRect.left + r.width / 2;
    const nodeCy = r.top  - vpRect.top  + r.height / 2;
    const dx = visibleCenterX - nodeCx;
    const dy = visibleCenterY - nodeCy;
    if (Math.abs(dx) > 40 || Math.abs(dy) > 40) {
      const cur = panzoomInst.getTransform();
      const target = { scale: cur.scale, x: cur.x + dx, y: cur.y + dy };
      smoothMoveTo(target, 380);
    }
  }, 50);
}

function closePanel() {
  activeNodeId = null;
  document.body.classList.remove('panel-open');
  document.getElementById('panel').classList.remove('open');
  document.getElementById('panel').setAttribute('aria-hidden', 'true');
  document.querySelectorAll('.node').forEach(el =>
    el.classList.remove('highlight', 'dim'));
}

/* ═════ Keyboard navigation ═════ */
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    if (document.body.classList.contains('info-open')) closeInfo();
    else if (document.body.classList.contains('panel-open')) closePanel();
    return;
  }
  if (!panzoomInst) return;
  // Don't intercept when typing in inputs
  if (e.target.matches('input, textarea, [contenteditable]')) return;
  const STEP = 80;
  if (e.key === 'ArrowLeft')  { panzoomInst.moveBy( STEP, 0, false); e.preventDefault(); }
  if (e.key === 'ArrowRight') { panzoomInst.moveBy(-STEP, 0, false); e.preventDefault(); }
  if (e.key === 'ArrowUp')    { panzoomInst.moveBy(0,  STEP, false); e.preventDefault(); }
  if (e.key === 'ArrowDown')  { panzoomInst.moveBy(0, -STEP, false); e.preventDefault(); }
  if (e.key === '+' || e.key === '=') {
    const v = getViewport();
    panzoomInst.smoothZoom(v.w / 2, v.h / 2, 1.25);
  }
  if (e.key === '-' || e.key === '_') {
    const v = getViewport();
    panzoomInst.smoothZoom(v.w / 2, v.h / 2, 0.8);
  }
  if (e.key === '0') { fitToView(true); }
});

/* ═════ Bootstrap ═════ */
let userHasInteracted = false;

function render() {
  applyI18N();
  renderZonesAndNodes();
  renderLegend();
  renderMinimap();
  setupMinimapClick();
}

function bootPanzoom() {
  initPanzoom();
  // Mark user-interaction so we know when to stop auto-fitting on resize
  ['panstart', 'zoom'].forEach(evt => {
    panzoomInst.on(evt, () => { userHasInteracted = true; });
  });

  // Wait until the viewport has real dimensions before fitting
  function tryFit() {
    const v = getViewport();
    if (v.w > 10 && v.h > 10) {
      fitToView(false);
      updateZoomClass();
      updateMinimapViewport();
      return true;
    }
    return false;
  }
  if (!tryFit()) {
    const ro = new ResizeObserver(() => {
      if (tryFit()) ro.disconnect();
    });
    ro.observe(document.getElementById('viewport'));
  }
}

window.addEventListener('resize', () => {
  if (!userHasInteracted) fitToView(false);
  updateMinimapViewport();
});

render();
if (document.readyState === 'complete') bootPanzoom();
else window.addEventListener('load', bootPanzoom);
</script>
</body>
</html>
